name: Backend syntax checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check learn-electronics-server/server.js
      - run: |
          for file in learn-electronics-server/services/*.js learn-electronics-server/middleware/*.js; do
            node --check "$file"
          done
